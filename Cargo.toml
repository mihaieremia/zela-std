[package]
name = "zela-std"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Guest-side SDK for Zela custom procedures: WIT bindings to the host runtime plus an optional Solana RPC client."
repository = "https://github.com/Zela-io/zela-std"
license = "MIT"
authors = ["RockawayX Infra"]
readme = "README.md"
keywords = ["wasm", "wasi", "solana", "rpc", "zela"]
categories = ["wasm", "api-bindings"]

[features]
default = ["solana"]
# Adds the Solana RPC + pubsub client on top of the host's call-rpc import.
solana = [
	"dep:thiserror",
	"dep:base64",
	"dep:bincode",
	"dep:solana-sdk",
	"dep:solana-commitment-config",
	"dep:solana-account-decoder-client-types",
	"dep:solana-transaction-status-client-types",
	"dep:solana-rpc-client-types",
]
# Preserve the `data` payload of structured JSON-RPC errors:
#   -32002 -> RpcResponseErrorData::SendTransactionPreflightFailure(simulation_logs)
#   -32005 -> RpcResponseErrorData::NodeUnhealthy { num_slots_behind }
# Off by default: deserializing `RpcSimulateTransactionResult` drags ~50-95 KB
# of type-tree code into every wasm that uses `RpcClient` (proportional to how
# much of the RPC surface the procedure touches). Read-only procedures don't
# care — the `Empty` variant is a fine fallback. Procedures that submit
# transactions and want preflight logs in their error path enable this:
#
#   [dependencies]
#   zela-std = { ..., features = ["tx-debug"] }
tx-debug = ["solana"]

[dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
futures-util = "0.3.31"

# Solana deps (gated). `solana-sdk` is the umbrella; `solana-commitment-config`
# is a direct dep because `CommitmentConfig` isn't re-exported and we use it
# in 37 places. The three `-client-types` crates supply the RPC DTO surface
# (Request, Response, config/filter) — pinned together at 3.1.12.
thiserror = { version = "2.0", optional = true }
base64 = { version = "0.22.1", optional = true }
bincode = { version = "1.3", optional = true }

solana-sdk = { version = "3", optional = true }
solana-commitment-config = { version = "3", features = ["serde"], optional = true }
solana-account-decoder-client-types = { version = "=3.1.12", features = ["zstd"], optional = true }
solana-transaction-status-client-types = { version = "=3.1.12", optional = true }
solana-rpc-client-types = { version = "=3.1.12", optional = true }

[dev-dependencies]
const_format = "0.2.34"
log = "0.4"
serde = { version = "1", features = ["derive"] }

# Applies only when zela-std is the root crate (examples, publishing).
# Cargo doesn't propagate profiles through deps — procedure workspaces need
# their own copy of this block for the same slim output.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[example]]
name = "echo"
crate-type = ["cdylib"]
